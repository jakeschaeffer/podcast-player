# snip.sch.xyz: the built web app and the server on one origin, reachable only through the Cloudflare
# tunnel (cloudflared → 127.0.0.1:4350). Installed as /etc/nginx/sites-available/podcast-player.

# Every request reaches nginx from cloudflared on 127.0.0.1, so the visitor is CF-Connecting-IP.
# Only POST /v1/devices (password login) is rate limited; an empty key is never limited.
map $request_method $pp_login_key {
    POST    $http_cf_connecting_ip;
    default "";
}
limit_req_zone $pp_login_key zone=pp_login:1m rate=6r/m;

upstream podcast_player_server {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 127.0.0.1:4350;
    server_name snip.sch.xyz;
    server_tokens off;

    root /var/www/podcast-player;
    client_max_body_size 1m;

    # The server: API, signed media, public snip and episode pages. Cloudflare must not keep copies at the
    # edge: a revoked or deleted snip has to stop serving at once, and public clip audio is sent with a
    # year-long browser cache that the edge would otherwise honour too.
    location = /v1/devices {
        limit_req zone=pp_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/podcast-player-proxy.conf;
    }
    # The home fetcher's uploads of video files and captions (fetcher/README.md): streamed through, gigabytes long.
    location ~ ^/v1/episodes/[^/]+/video/(file|captions)$ {
        client_max_body_size 8g;
        proxy_request_buffering off;
        include /etc/nginx/snippets/podcast-player-proxy.conf;
    }
    location ~ ^/(v1|m|s|e)/ {
        include /etc/nginx/snippets/podcast-player-proxy.conf;
    }

    # Hashed build output never changes.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The app shell, the service worker, and icons are rechecked on each visit so a deploy reaches the phone.
    # Any other path is a client-side route and gets index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
