# Shared proxy settings for the podcast player server. Installed as
# /etc/nginx/snippets/podcast-player-proxy.conf and included by the podcast-player site.
proxy_pass http://podcast_player_server;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# This site is only reachable through the tunnel, so every request arrived over https. The server trusts
# these headers for the cookie's Secure flag and the visitor's address.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
proxy_set_header X-Real-IP $http_cf_connecting_ip;
# Stream audio (with its Range requests) straight through instead of spooling it to disk.
proxy_buffering off;
proxy_read_timeout 120s;
add_header Cloudflare-CDN-Cache-Control "no-store" always;
